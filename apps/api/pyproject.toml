[project]
name = "depositrack-api"
version = "0.1.0"
description = "DepositTrack backend: AICTE security deposit / FDR management API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "pyjwt[crypto]>=2.8,<3",
    "httpx>=0.27,<1",
    "pyyaml>=6.0,<7",
    "python-multipart>=0.0.9",
    "boto3>=1.34",
    "pillow>=10.1",
    "numpy>=1.26",
    "rapidocr>=3.0",
    "onnxruntime>=1.18",
    "openpyxl>=3.1",
    "reportlab>=4.0",
]

[project.optional-dependencies]
ml = [
    "scikit-image>=0.24",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "shap>=0.45",
]
# Fetches the open training datasets (ml/download_open_data.py); nothing under app/ imports it.
data = [
    "kagglehub>=1.0",
]
# immudb receipts for Merkle anchors (N4); needed only with DT_IMMUDB_ENABLED=true.
# Pinned exactly: immudb-py is the only official Python client (it does the client-side
# proof checks), but its metadata is a `pip freeze` dump with open lower bounds that pulls
# in ~29 packages, among them appier (a web framework), Hive Solutions' `google-api` and
# Google API/auth clients. At runtime it only imports grpcio, protobuf,
# googleapis-common-protos and ecdsa. Review the tree before bumping.
anchoring = [
    "immudb-py==1.5.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # tests import tests.flow_support; makes a bare `pytest` work

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
# Compares parsed words such as "hundred"; flagged as a password by mistake.
"app/modules/checks/words.py" = ["S105"]
