# Lint settings for the ML training scripts (ml/forgery, ml/risk).
line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "I", "B", "UP", "S"]
# Seeded pseudo-randomness is intended: it generates reproducible synthetic data, not secrets.
ignore = ["S311"]

[lint.per-file-ignores]
"tests/**" = ["S101"]
