name: CI

# The same checks AGENTS.md asks for before every push: lint, format and tests for each
# package, the web build, and a Compose config check. Nothing here deploys or costs money.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: pip install -e ".[dev,ml,data]"
      - run: ruff check . && ruff format --check .
      # python -m puts apps/api on sys.path, which the tests' `tests.flow_support` imports need.
      - run: python -m pytest -q

  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: pip install -e "apps/api[dev,ml,data]"
      - name: Synthetic FDR generator
        if: hashFiles('ml/synthetic_fdr/pyproject.toml') != ''
        run: |
          pip install -e "ml/synthetic_fdr[dev]"
          ruff check ml/synthetic_fdr && ruff format --check ml/synthetic_fdr
          python -m pytest -q ml/synthetic_fdr
      - name: ML scripts
        working-directory: ml
        run: ruff check . && ruff format --check . && python -m pytest -q tests

  mock-bank:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/mock-bank
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/mock-bank/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm install -g npm@11.6.2
      - run: npm ci
      - run: cp .env.example .env.local
      - run: npx eslint src
      - run: npx tsc --noEmit
      - run: npx next build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp infra/.env.example infra/.env
      - run: docker compose -f infra/docker-compose.yml --env-file infra/.env config --quiet
